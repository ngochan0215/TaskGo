<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" type="text/css" href="../../public/css/output.css" />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../public/favicons/favicon.ico"
    />

    <title>TaskGo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>

  <body
    class="bg-[#95DA97] flex justify-center py-8 font-montserrat min-h-screen"
  >
    <div
      class="w-full max-w-xs bg-[#EAFED9] rounded-3xl shadow-xl overflow-hidden flex flex-col"
    >
      <header class="bg-[#95DA97] px-4 py-3 flex items-center justify-between">
        <div class="flex items-center">
          <div
            class="rounded-full bg-white flex items-center justify-center overflow-hidden"
            style="width: 100px; height: 100px"
          >
            <img
              src="/public/images/taskgo-logo.png"
              alt="TaskGo logo"
              class="object-contain"
              style="width: 100px; height: 100px"
            />
          </div>
        </div>

        <h1 class="text-base font-bold text-[#16411F]">Trạng thái đơn</h1>

        <div class="w-10 h-10 flex items-center justify-center">
          <span class="material-symbols-outlined text-[#16411F] text-3xl">
            menu
          </span>
        </div>
      </header>

      <main class="flex-1 pt-6 pb-6 flex flex-col">
        <section
          class="bg-[#FFFFFF] rounded-[32px] shadow-md px-5 py-5 flex flex-col gap-4 w-[90%] mx-auto"
        >
          <p class="text-base font-semibold text-[#16411F] text-center">
            ĐANG CHUẨN BỊ
          </p>

          <div class="flex items-center gap-3 mt-1">
            <span class="material-symbols-outlined text-[#16411F] text-xl">
              person
            </span>
            <h2 class="text-lg font-bold text-[#16411F]">Nguyễn Minh An</h2>
          </div>

          <div class="border-t border-gray-100"></div>

          <div class="flex flex-col gap-3 text-sm text-gray-800">
            <div class="flex items-center gap-3">
              <span
                class="material-symbols-outlined text-[#16411F] text-xl mt-[1px]"
              >
                location_on
              </span>
              <p class="text-sm text-gray-700 flex-1">
                45 Nguyễn Văn Linh, Quận 7
              </p>
            </div>

            <div class="flex items-center gap-3">
              <span
                class="material-symbols-outlined text-[#16411F] text-xl mt-[1px]"
              >
                cleaning_services
              </span>
              <p class="text-base text-gray-700 flex-1">Dọn dẹp nhà</p>
            </div>
          </div>
          <div class="mt-2">
            <p class="text-sm font-bold text-[#16411F]">GHI CHÚ CỦA KHÁCH:</p>
            <p class="text-sm text-gray-700 mt-2">
              Lau cửa sổ, mang cây lau nhà
            </p>
          </div>

          <br />
          <div class="pt-4 flex justify-center">
            <button
              class="w-[75%] bg-[#5C956C] text-[#FFFFFF] py-3 rounded-full text-base font-semibold shadow-md hover:bg-[#3B5F43] transition-colors"
            >
              Đã chuẩn bị xong
            </button>
          </div>
        </section>
      </main>

      <footer class="bg-[#95DA97] border-t border-[#5C956C]">
        <nav class="flex justify-around py-2 text-xs">
          <a
            href="#"
            class="flex flex-col items-center text-[#16411F] no-underline"
          >
            <span class="material-symbols-outlined text-2xl">home</span>
            Trang chủ
          </a>
          <a
            href="#"
            class="flex flex-col items-center text-white font-semibold no-underline"
          >
            <span class="material-symbols-outlined text-2xl">news</span>
            Hoạt động
          </a>
          <a
            href="#"
            class="flex flex-col items-center text-[#16411F] no-underline"
          >
            <span class="material-symbols-outlined text-2xl">chat</span>
            Tin nhắn
          </a>
          <a
            href="#"
            class="flex flex-col items-center text-[#16411F] no-underline"
          >
            <span class="material-symbols-outlined text-2xl">
              notifications
            </span>
            Thông báo
          </a>
        </nav>
      </footer>
    </div>
  </body>
</html>
