<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="../../public/css/output.css">
    <link rel="icon" type="image/x-icon" href="../../public/favicons/favicon.ico">

    <title>Đăng ký làm Tasker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #68A776;
            --accent-color: #ACCFB2;
        }
        .input-field:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 1px var(--primary-color);
        }
    </style>
</head>

<body class="bg-gray-100 flex justify-center py-10 font-montserrat min-h-screen">

<div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-8 border border-gray-200">

    <div class="mb-8">
        <a href="signup_customer.html" class="inline-block p-1 mb-8 -ml-2 text-gray-500 hover:text-dark-900 transition-colors">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 19L8 12L15 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>

        <div class="text-center">
            <h1 class="text-2xl font-bold text-primary-400 border-b-2 border-primary-400 pb-2 inline-block">
                Đăng ký làm Tasker
            </h1>
        </div>
    </div>

    <form id="tasker-signup-form-1">

        <label class="block text-dark-900 font-medium mb-1" for="phone">Số điện thoại</label>
        <div class="relative mb-6">
            <input type="tel" id="phone" name="phone" value="0912345678"
                   placeholder="Nhập số điện thoại của bạn"
                   class="w-full border border-gray-300 input-field rounded-xl px-4 py-3 transition-colors" required>
        </div>

        <label class="block text-dark-900 font-medium mb-1" for="email">Email</label>
        <div class="relative mb-6">
            <input type="email" id="email" name="email" value="xyz@gmail.com"
                   placeholder="Nhập email của bạn"
                   class="w-full border border-gray-300 input-field rounded-xl px-4 py-3 transition-colors" required>
        </div>

        <label class="block text-dark-900 font-medium mb-1" for="name">Họ tên</label>
        <div class="relative mb-6">
            <input type="text" id="name" name="name" value="Nguyễn Văn A"
                   placeholder="Nhập họ tên đầy đủ"
                   class="w-full border border-gray-300 input-field rounded-xl px-4 py-3 transition-colors" required>
        </div>

        <label class="block text-dark-900 font-medium mb-1" for="experience">Kinh nghiệm làm việc</label>
        <div class="relative mb-8">
            <textarea id="experience" name="experience" rows="4"
                      placeholder="Mô tả kinh nghiệm của bạn (ví dụ: đã làm việc 2 năm trong lĩnh vực vệ sinh công nghiệp)"
                      class="w-full border border-gray-300 input-field rounded-xl px-4 py-3 transition-colors" required></textarea>
        </div>

        <button type="submit"
                class="w-full bg-primary-400 text-white py-3 rounded-xl text-lg font-semibold hover:bg-accent-400 transition-colors">
            Tiếp tục
        </button>
    </form>
</div>

<script>
    document.getElementById('tasker-signup-form-1').addEventListener('submit', function(e) {
        e.preventDefault();
        window.location.href = 'tasker_signup_02.html';
    });
</script>

</body>
</html>
