<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" type="text/css" href="../../public/css/output.css">
  <link rel="icon" type="image/x-icon" href="../../public/favicons/favicon.ico">

  <title>Đăng nhập / Đăng ký</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<body class="bg-gray-100 flex justify-center py-10 font-montserrat">

<div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-8 border border-gray-200">

    <div class="flex gap-10 text-lg font-semibold">

        <label class="block text-dark-900 font-medium mb-1">Mật khẩu</label>

          </button>
        </div>

        <div class="flex justify-end mb-4">
          <a href="forgot-password.html" class="text-primary-400 text-sm font-medium">Quên mật khẩu?</a>
        </div>

        <button class="w-full bg-primary-400 text-white py-3 rounded-xl text-lg font-semibold mb-6 hover:bg-primary-500">
          Tiếp tục
        </button>

        <div class="flex items-center my-4">
          <div class="flex-grow border-t"></div>
          <span class="px-3 text-gray-400">Hoặc</span>
          <div class="flex-grow border-t"></div>
        </div>

        <button class="w-full border rounded-xl py-3 flex justify-center gap-3 mb-3">
          <span class="text-xl"></span> Đăng nhập với Apple
        </button>

        <button class="w-full border rounded-xl py-3 flex justify-center items-center gap-3">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-6">
          Đăng nhập với Google
        </button>

        <div class="text-center mt-8">
          <span class="text-gray-400">Chưa có tài khoản?</span>
          <button id="goto-signup" class="text-primary-400 font-medium">Đăng ký</button>
        </div>

      </div>

      <div class="w-full flex-shrink-0 px-1">

        <label class="block text-dark-900 font-medium mb-1">Số điện thoại</label>
        <input type="text" class="w-full border border-gray-300 rounded-xl px-4 py-3 mb-4">

        <label class="block text-dark-900 font-medium mb-1">Email</label>
        <input type="email" class="w-full border border-gray-300 rounded-xl px-4 py-3 mb-4">

        <label class="block text-dark-900 font-medium mb-1">Họ tên</label>
        <input type="text" class="w-full border border-gray-300 rounded-xl px-4 py-3 mb-6">

        <button class="w-full bg-primary-400 text-white py-3 rounded-xl text-lg font-semibold mb-6 hover:bg-primary-500">
          Tiếp tục
        </button>

        <div class="text-center mt-8">
          <span class="text-gray-400">Đăng ký làm Tasker?</span>
          <button id="goto-login" class="text-primary-400 font-medium">Đăng ký</button>
        </div>

      </div>

    </div>

  </div>

</div>

<script>
  const tabLogin = document.getElementById("tab-login");
  const tabSignup = document.getElementById("tab-signup");
  const gotoLogin = document.getElementById("goto-login");
  const gotoSignup = document.getElementById("goto-signup");
  const formSlider = document.getElementById("form-slider");

  const passwordInput = document.getElementById("password-input");
  const togglePassword = document.getElementById("toggle-password");
  const eyeOpenIcon = document.getElementById("eye-open-icon");
  const eyeSlashIcon = document.getElementById("eye-slash-icon");

  function setActiveTab(active) {
    tabLogin.classList.remove("text-primary-400", "border-b-2", "border-primary-400");
    tabLogin.classList.add("text-gray-400");

    tabSignup.classList.remove("text-primary-400", "border-b-2", "border-primary-400");
    tabSignup.classList.add("text-gray-400");

    if (active === "login") {
      tabLogin.classList.remove("text-gray-400");
      tabLogin.classList.add("text-primary-400", "border-b-2", "border-primary-400");
    } else {
      tabSignup.classList.remove("text-gray-400");
      tabSignup.classList.add("text-primary-400", "border-b-2", "border-primary-400");
    }
  }
  function showSignupForm() {
    formSlider.classList.add("-translate-x-full");
    setActiveTab("signup");
  }

  function showLoginForm() {
    formSlider.classList.remove("-translate-x-full");
    setActiveTab("login");
  }

  tabSignup.addEventListener("click", showSignupForm);
  gotoSignup.addEventListener("click", showSignupForm);

  tabLogin.addEventListener("click", showLoginForm);
  gotoLogin.addEventListener("click", showLoginForm);
  setActiveTab("login");

  togglePassword.addEventListener("click", function () {
    const isPassword = passwordInput.type === "password";
    passwordInput.type = isPassword ? "text" : "password";

    eyeOpenIcon.classList.toggle("hidden", !isPassword);
    eyeSlashIcon.classList.toggle("hidden", isPassword);
  });
</script>

</body>
</html>
