            Cập nhật mật khẩu
        </button>

<script>
    function togglePasswordVisibility(inputId, toggleButton) {
        const input = document.getElementById(inputId);
        const isPassword = input.getAttribute('type') === 'password';

        input.setAttribute('type', isPassword ? 'text' : 'password');

        const iconBaseId = inputId.replace('-password', '');
        const eyeOpen = toggleButton.querySelector(`#eye-open-${iconBaseId}`);
        const eyeSlash = toggleButton.querySelector(`#eye-slash-${iconBaseId}`);

        if (isPassword) {
            eyeOpen.classList.remove('hidden');
            eyeSlash.classList.add('hidden');
        } else {
            eyeOpen.classList.add('hidden');
            eyeSlash.classList.remove('hidden');
        }
    }

    document.getElementById('reset-password-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (newPassword.length < 6) {
            alert('Mật khẩu phải có ít nhất 6 ký tự.');
            return;
        }

        if (newPassword !== confirmPassword) {
            alert('Mật khẩu mới và mật khẩu xác nhận không khớp.');
            return;
        }

        window.location.href = 'fp-auth-success.html';
    });
</script>
