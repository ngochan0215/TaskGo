<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="../../public/css/output.css">
    <link rel="icon" type="image/x-icon" href="../../public/favicons/favicon.ico">

    <title id="page-title">Thông báo Thành công</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Đảm bảo màu sắc đồng nhất */
        :root {
            --primary-color: #68A776; /* Màu xanh lá đậm */
            --accent-color: #ACCFB2; /* Màu xanh lá nhạt */
        }
    </style>
</head>

<body class="bg-gray-100 flex justify-center py-10 font-montserrat min-h-screen">

<div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-8 border border-gray-200">

    <a id="back-button" href="#" class="inline-block p-1 mb-10 -ml-2 text-dark-900 hover:text-gray-600 transition-colors">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 19L8 12L15 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>

    <div id="content-container">

        <div id="logo-icon-container" class="flex justify-start mb-6 hidden">
            <svg id="success-icon" width="80" height="80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" fill="#ACCFB2"/>
                <path d="M12 7V17M7 12H17" stroke="#68A776" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" fill="#68A776"/>
            </svg>
        </div>

        <h1 id="main-title" class="text-2xl font-bold text-dark-900 mb-2"></h1>

        <p id="description" class="text-gray-500 text-base mb-16"></p>
    </div>

    <a id="main-button" href="#"
       class="block w-full text-center bg-primary-400 text-white py-3 rounded-xl text-lg font-semibold hover:bg-accent-400 transition-colors">
    </a>

</div>

<script>
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    const successTypes = {
        'fp-auth': {
            pageTitle: 'Xác thực thành công',
            mainTitle: 'Đã xác thực thành công',
            description: 'Đã xác thực thành công.<br>Nhấn xác nhận để đặt lại mật khẩu mới.',
            buttonText: 'Xác nhận',
            buttonLink: 'reset-password.html',
            icon: 'none',
            backLink: 'otp.html'
        },

        'su-auth': { // Loại MỚI: Đăng ký + OTP thành công
            pageTitle: 'Xác thực thành công',
            mainTitle: 'Đã xác thực thành công',
            description: 'Đã xác thực thành công. <br>Nhấn tiếp tục để đặt mật khẩu.',
            buttonText: 'Tiếp tục',
            buttonLink: 'set-password.html',
            icon: 'none', // Giữ bố cục Form/List, không có icon
            backLink: 'otp.html' // Quay lại trang OTP nếu cần
        }
    };

    function getIconSvg(iconType) {
        if (iconType === 'taskgo') {
            return `
                <circle cx="12" cy="12" r="10" fill="#ACCFB2"/>
                <path d="M12 7V17M7 12H17" stroke="#68A776" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" fill="#68A776"/>
            `;
        }
        return '';
    }

    function updateSuccessPage() {
        const type = getQueryParam('type');
        const data = successTypes[type];

        if (!data) {
            document.getElementById('main-title').textContent = 'Lỗi';
            document.getElementById('description').textContent = 'Không tìm thấy thông tin thành công.';
            document.getElementById('main-button').textContent = 'Về trang chủ';
            document.getElementById('main-button').href = 'login-signup.html';
            document.getElementById('back-button').href = 'login-signup.html';
            return;
        }

        document.getElementById('page-title').textContent = data.pageTitle;
        document.getElementById('main-title').textContent = data.mainTitle;
        document.getElementById('description').innerHTML = data.description;
        document.getElementById('main-button').textContent = data.buttonText;
        document.getElementById('main-button').href = data.buttonLink;
        document.getElementById('back-button').href = data.backLink;

        const logoIconContainer = document.getElementById('logo-icon-container');
        const successIconSvg = document.getElementById('success-icon');

        if (data.icon === 'taskgo') {
            // Hiển thị icon TaskGo ở đầu Card, căn giữa
            logoIconContainer.classList.remove('hidden');
            logoIconContainer.classList.remove('justify-start');
            logoIconContainer.classList.add('justify-center');
            successIconSvg.innerHTML = getIconSvg('taskgo');
        } else {
            logoIconContainer.classList.add('hidden');
        }
    }

    window.onload = updateSuccessPage;
</script>

</body>
</html>
