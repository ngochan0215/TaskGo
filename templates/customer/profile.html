<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskGo</title>
  <link rel="stylesheet" type="text/css" href="../../public/css/output.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="icon" type="image/x-icon" href="../../public/favicons/favicon.ico">
</head>

<body class="bg-primary-100 min-h-screen font-montserrat">
  <header class="bg-primary-200 py-4">
    <div class="flex items-center justify-between px-4">
      <div class="text-primary-500 w-10 h-10 rounded-full bg-white flex items-center justify-center opacity-70">
        <a href=""><img src="/public/images/taskgo-logo.png" alt=""></a>
      </div>

      <h1 class="font-bold text-xl text-dark-900">Thông tin cá nhân</h1>
      <div class="w-10 h-10 flex items-center justify-center">
        <a href=""><span class="material-symbols-outlined text-primary-500 text-4xl">menu</span></a>
      </div>
    </div>
  </header>

  <main class="p-4 space-y-4 pb-20">
    <!-- Favorite services section -->
    <div class="flex flex-col items-center p-4 space-y-4">
        <div class="relative w-32 h-32">
            <div class="w-full h-full rounded-full border-4 border-primary-400 overflow-hidden">
                <img src="placeholder_avatar.jpg" alt="" class="w-full h-full object-cover">
            </div>
            
            <button class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-md border border-gray-200 hover:opacity-80">
                <span class="material-symbols-outlined text-sm text-gray-700">
                    photo_camera
                </span>
                <input type="file" class="absolute inset-0 opacity-0 cursor-pointer" onchange="previewAvatar(event)">
            </button>
        </div>
        
        <h1 class="text-2xl font-bold text-dark-900 mt-4">Nguyễn Văn A</h1>
        <div class="flex items-center text-base text-dark-900 cursor-pointer hover:text-primary-dark">
            <span>Chỉnh sửa thông tin</span>
            <span class="material-symbols-outlined text-base ml-1">edit</span>
        </div>


    </div>

    <div class="space-y-4">
        <h2 class="text-base font-semibold text-dark-900 pb-2">Thông tin cá nhân:</h2>
        
        <div>
            <label for="email" class="text-base font-medium text-dark-900 block mb-1">Email</label>
            <input 
                type="email" 
                id="email" 
                value="melpeters@gmail.com" 
                class="w-full p-3 border border-gray-300 rounded-lg 
                       focus:outline-none focus:ring-2 focus:ring-primary-500"
            />
        </div>
        
        <div>
            <label for="phone" class="text-base font-medium text-dark-900 block mb-1">Số điện thoại</label>
            <input 
                type="tel" 
                id="phone" 
                value="0123456789" 
                class="w-full p-3 border border-gray-300 rounded-lg 
                       focus:outline-none focus:ring-2 focus:ring-primary-500"
            />
        </div>
        
        <div>
            <label for="address-1" class="text-base font-medium text-dark-900 block mb-1">Địa chỉ</label>
            <div class="flex items-center space-x-2 bg-white p-3 border border-gray-300 rounded-lg">
                <input 
                    type="text" 
                    id="address-1" 
                    value="Đường số 1, KP Tân An,......" 
                    class="flex-1 border-none focus:outline-none bg-transparent"
                />
                <button class="text-gray-100 hover:text-red-500">
                    <span class="material-symbols-outlined text-xl">delete</span>
                </button>
            </div>
        </div>

        <button class="w-full flex items-center justify-center p-3 rounded-lg bg-gray-200 text-dark-900 font-medium space-x-1 hover:bg-gray-400 hover:text-white">
            <span class="material-symbols-outlined text-lg">add</span>
            <span>Thêm địa chỉ</span>
        </button>
        
    </div>
    <div class="pt-6">
        <button class="action-btn action-btn-hover w-full ">
            Cập nhật thông tin
        </button>
    </div>
  </main>

  <footer>
    <nav class="fixed bottom-0 left-0 right-0 bg-primary-200 border-t shadow-xl">
      <div class="flex justify-around py-2 text-base">
        <a href="#" class="flex flex-col items-center text-white">
          <span class="material-symbols-outlined text-4xl">house</span>
          Trang chủ
        </a>
        <a href="#" class="flex flex-col items-center text-primary-500">
          <span class="material-symbols-outlined text-4xl">news</span>
          Hoạt động
        </a>
        <a href="#" class="flex flex-col items-center text-primary-500">
          <span class="material-symbols-outlined text-4xl">chat</span>
          Tin nhắn
        </a>
        <a href="#" class="flex flex-col items-center text-primary-500">
          <span class="material-symbols-outlined text-4xl">lightbulb</span>
          Thông báo
        </a>
      </div>
    </nav>
  </footer>
</body>

</html>
