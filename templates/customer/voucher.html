<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskGo</title>
    <link rel="stylesheet" type="text/css" href="../../../public/css/output.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="icon" type="image/x-icon" href="../../public/favicons/favicon.ico">
</head>

<body class="bg-primary-100 min-h-screen font-montserrat">
    <header class="bg-primary-200 py-4">
        <div class="flex items-center justify-between px-4">
            <div class="text-primary-500 w-10 h-10 rounded-full bg-white flex items-center justify-center opacity-70">
                <a href=""><img src="/public/images/taskgo-logo.png" alt=""></a>
            </div>

            <h1 class="font-bold text-xl text-dark-900">Dịch vụ của bạn</h1>
            <div class="w-10 h-10 flex items-center justify-center">
                <a href=""><span class="material-symbols-outlined text-primary-500 text-4xl">menu</span></a>
            </div>
        </div>
    </header>

    <main class="p-4 space-y-4 pb-32">
        <div class="bg-white rounded-xl shadow-md p-4 space-y-4">
            <div class="flex justify-between items-center relative">

                <a href="payment.html" class="text-gray-100 font-medium hover:text-primary-darker">
                    Thoát
                </a>

                <h2 class="text-lg font-bold text-gray-800 absolute left-1/2 transform -translate-x-1/2">
                    Thêm khuyến mãi
                </h2>

                <a href="payment.html" class="text-secondary-100 font-bold">
                    Lưu
                </a>

            </div>
            <!-- Thêm mã giảm giá -->
            <div class="flex justify-between items-center space-x-4">
                <input type="text" placeholder="Nhập mã khuyến mãi" class="flex-1 p-3 border border-gray-300 rounded-xl 
                       focus:outline-none focus:ring-2 focus:ring-primary-500" />

                <button class="action-btn action-btn-hover">
                    Thêm
                </button>
            </div>
            <p class="text-dark-900 font-medium pt-2">Ưu đãi của bạn</p>

            <div class="space-y-3">

                <label for="ud1"
                    class="flex justify-between items-center bg-white rounded-xl shadow-md p-4 cursor-pointer">
                    <div>
                        <p class="text-sm text-gray-100">UD1</p>
                        <p class="text-base text-dark-900">Giảm 10% cho đơn hàng thứ 2</p>
                    </div>
                    <input type="radio" id="ud1" name="promo" value="ud1"
                        class="h-5 w-5 text-secondary-200 border-gray-400" />
                </label>

                <label for="ud2"
                    class="flex justify-between items-center bg-white rounded-xl shadow-md p-4 cursor-pointer">
                    <div>
                        <p class="text-sm text-gray-100">UD2</p>
                        <p class="text-base text-dark-900">Giảm 50% cho đơn hàng đầu tiên</p>
                    </div>
                    <input type="radio" id="ud2" name="promo" value="ud2"
                        class="h-5 w-5 text-secondary-200 border-gray-400" />
                </label>

                <label for="ud3"
                    class="flex justify-between items-center bg-white rounded-xl shadow-md p-4 cursor-pointer">
                    <div>
                        <p class="text-sm text-gray-100">UD3</p>
                        <p class="text-base text-dark-900">Giảm 10.000 VND cho đơn hàng từ 100.000 VND</p>
                    </div>
                    <input type="radio" id="ud3" name="promo" value="ud3"
                        class="h-5 w-5 text-secondary-200 border-gray-400" />
                </label>

                <label for="ud4"
                    class="flex justify-between items-center bg-white rounded-xl shadow-md p-4 cursor-pointer">
                    <div>
                        <p class="text-sm text-gray-100">UD4</p>
                        <p class="text-base text-dark-900">Miễn phí cho khách hàng thứ 9999</p>
                    </div>
                    <input type="radio" id="ud4" name="promo" value="ud4"
                        class="h-5 w-5 text-secondary-200 border-gray-400" />
                </label>

            </div>
        </div>
    </main>
    <footer>
        <nav class="fixed bottom-0 left-0 right-0 bg-primary-200 border-t shadow-xl">
            <div class="flex justify-around py-2 text-base">
                <a href="#" class="flex flex-col items-center text-primary-500">
                    <span class="material-symbols-outlined text-4xl">house</span>
                    Trang chủ
                </a>
                <a href="#" class="flex flex-col items-center text-white">
                    <span class="material-symbols-outlined text-4xl">news</span>
                    Hoạt động
                </a>
                <a href="#" class="flex flex-col items-center text-primary-500">
                    <span class="material-symbols-outlined text-4xl">chat</span>
                    Tin nhắn
                </a>
                <a href="#" class="flex flex-col items-center text-primary-500">
                    <span class="material-symbols-outlined text-4xl">lightbulb</span>
                    Thông báo
                </a>
            </div>
        </nav>
    </footer>
</body>

</html>
