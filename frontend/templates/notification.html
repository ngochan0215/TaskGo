<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskGo - Thông báo</title>

    <link rel="stylesheet" href="../public/css/output.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <style>
      body {
        background-color: #f1f5f9;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 10px;
      }
      .fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>

    <script src="../components/cus_header.js" defer></script>
    <script src="../components/cus_footer.js" defer></script>
  </head>

  <body class="font-montserrat h-screen flex flex-col text-slate-800">
    <app-header active="notification"></app-header>

    <main
      class="flex-1 w-full max-w-6xl mx-auto px-4 py-6 md:py-8 flex gap-6 overflow-hidden"
    >
      <aside
        class="w-[280px] hidden md:flex flex-col bg-white rounded-2xl shadow-sm border border-slate-200/60 overflow-hidden h-full"
      >
        <nav class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-1">
          <button
            onclick="filterNotifs('all')"
            id="tab-all"
            class="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-green-50 text-green-700 font-bold transition-all border border-green-100 shadow-sm"
          >
            <span class="material-symbols-outlined">notifications_active</span>
            <span class="text-sm">Tất cả thông báo</span>
            <span
              id="badge-count"
              class="ml-auto bg-green-600 text-white text-[11px] font-bold px-2 py-0.5 rounded-full shadow-sm shadow-green-200"
              style="display: none"
              >0</span
            >
          </button>

          <button
            onclick="filterNotifs('order')"
            id="tab-order"
            class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 font-medium hover:bg-slate-50 hover:text-slate-700 transition-all"
          >
            <span class="material-symbols-outlined">receipt_long</span>
            <span class="text-sm">Cập nhật đơn hàng</span>
          </button>

          <button
            onclick="filterNotifs('discount')"
            id="tab-discount"
            class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 font-medium hover:bg-slate-50 hover:text-slate-700 transition-all"
          >
            <span class="material-symbols-outlined">percent</span>
            <span class="text-sm">Khuyến mãi & Ưu đãi</span>
          </button>

          <button
            onclick="filterNotifs('system')"
            id="tab-system"
            class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 font-medium hover:bg-slate-50 hover:text-slate-700 transition-all"
          >
            <span class="material-symbols-outlined">settings_alert</span>
            <span class="text-sm">Tin hệ thống</span>
          </button>
        </nav>
      </aside>

      <section
        class="flex-1 flex flex-col bg-white rounded-2xl shadow-sm border border-slate-200/60 overflow-hidden h-full relative"
      >
        <div
          class="px-6 py-4 h-[72px] border-b border-slate-100 flex items-center justify-between bg-white shrink-0"
        >
          <div>
            <h1 id="page-title" class="font-bold text-xl text-slate-800">
              Tất cả thông báo
            </h1>
          </div>

          <button
            onclick="markAllRead()"
            id="btn-read-all"
            class="group flex items-center gap-2 px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-xs font-semibold hover:border-green-500 hover:text-green-600 hover:bg-green-50 transition-all shadow-sm opacity-50 cursor-not-allowed"
            disabled
          >
            <span
              class="material-symbols-outlined text-[18px] group-hover:text-green-600"
              >done_all</span
            >
            Đánh dấu đã đọc
          </button>
        </div>

        <div
          id="notification-list"
          class="flex-1 p-5 overflow-y-auto custom-scrollbar space-y-4 bg-slate-50/50"
        ></div>
      </section>
    </main>

    <app-footer></app-footer>

    <div id="toast-container" class="fixed top-5 right-5 space-y-3 z-50"></div>

    <script src="./js/config.js"></script>

    <script
      src="https://cdn.socket.io/4.7.2/socket.io.min.js"
      integrity="sha384-mZLF4UVrpi/QTWPA7BjNPEnkIfRFn4ZEO3Qt/HFklTJBj/gBOV8G3HcKn4NfQblz"
      crossorigin="anonymous"
    ></script>

    <script src="./js/notification.js"></script>
  </body>
</html>
