<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="../../public/css/output.css">
    <link rel="icon" type="image/x-icon" href="../../public/favicons/favicon.ico">

    <title id="page-title">Thông báo Thành công</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #68A776;
            --accent-color: #ACCFB2;
        }
        .success-icon-bg {
            background-color: var(--accent-color);
        }
        .success-icon-fg {
            color: var(--primary-color);
        }
    </style>
</head>

<body class="bg-gray-100 flex items-center justify-center font-montserrat min-h-screen p-4">

<div class="w-full max-w-sm bg-white shadow-lg rounded-2xl p-8 text-center flex flex-col items-center border border-gray-200">

    <div class="w-24 h-24 rounded-full flex items-center justify-center mb-6 success-icon-bg">
        <img src="../../public/images/img.png" alt="TaskGo Logo" class="w-16 h-16 object-contain">
    </div>

    <h1 id="main-heading" class="text-2xl font-bold text-dark-900 mb-2">...</h1>

    <p id="sub-text" class="text-gray-500 text-sm mb-8 leading-relaxed">...</p>

    <button id="action-button"
            class="w-full bg-primary-400 text-white py-3 rounded-xl text-lg font-semibold hover:bg-accent-400 transition-colors">
        ...
    </button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');

        const pageTitle = document.getElementById('page-title');
        const mainHeading = document.getElementById('main-heading');
        const subText = document.getElementById('sub-text');
        const actionButton = document.getElementById('action-button');

        let defaultHeading = "Thành công!";
        let defaultSubText = "Yêu cầu của bạn đã được xử lý thành công.";
        let defaultButtonText = "Tiếp tục";
        let defaultRedirect = "login-signup.html";

        switch (type) {
            case 'rp-success':
                pageTitle.textContent = "Đặt lại Mật khẩu Thành công";
                mainHeading.textContent = "Thành công";
                subText.innerHTML = "Mật khẩu của bạn đã được cập nhật thành công!<br>Nhấn tiếp tục để đăng nhập";
                actionButton.textContent = "Đăng nhập";
                defaultRedirect = "login-signup.html";
                break;
            case 'su-success':
                pageTitle.textContent = "Đăng ký Thành công";
                mainHeading.textContent = "Chào mừng!";
                subText.innerHTML = "Chào mừng bạn đến với TASKGO!<br>Nhấn tiếp tục để đăng nhập";
                actionButton.textContent = "Đăng nhập";
                defaultRedirect = "login-signup.html";
                break;
            case 'su-registered':
                pageTitle.textContent = "Đơn đăng ký đã ghi nhận";
                mainHeading.textContent = "Thành công";
                subText.innerHTML = "Đơn đăng ký đã được ghi nhận!<br>Vui lòng để ý điện thoại để TASKGO liên lạc";
                actionButton.textContent = "Trở về";
                defaultRedirect = "login-signup.html";
                break;
            default:
                pageTitle.textContent = defaultHeading;
                mainHeading.textContent = defaultHeading;
                subText.innerHTML = defaultSubText;
                actionButton.textContent = defaultButtonText;
                defaultRedirect = "login-signup.html";
                break;
        }

        actionButton.addEventListener('click', function() {
            window.location.href = defaultRedirect;
        });
    });
</script>

</body>
</html>
