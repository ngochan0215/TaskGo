<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký làm Tasker - Bước 3</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link rel="stylesheet" type="text/css" href="../../public/css/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary-color: #68A776; }
        .input-field:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 1px var(--primary-color);
            outline: none;
        }

        .input-field:disabled {
            background-color: #f3f4f6;
            color: #9ca3af;
            cursor: not-allowed;
            border-color: #e5e7eb;
        }

        #map {
            height: 400px;
            background-color: #E0E0E0;
            border: 1px solid #D1D5DB;
            z-index: 1;
        }
    </style>
</head>

<body class="bg-gray-100 flex justify-center py-10 font-montserrat min-h-screen">

<div class="w-full max-w-2xl bg-white shadow-lg rounded-2xl p-8 border border-gray-200">

    <div class="mb-8">
        <a href="tasker_signup_02.html" class="inline-block p-1 mb-6 -ml-2 text-gray-500 hover:text-dark-900 transition-colors">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19L8 12L15 5"/></svg>
        </a>
        <div class="text-center">
            <h1 class="text-3xl font-bold text-primary-400 border-b-2 border-primary-400 pb-2 inline-block">
                Khu vực hoạt động
            </h1>
            <p class="text-gray-500 mt-2">Chọn địa chỉ cư trú và bán kính làm việc mong muốn</p>
        </div>
    </div>

    <form id="tasker-signup-form-3">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="space-y-6">
                <div>
                    <label class="block text-gray-800 font-bold mb-2">Tỉnh / Thành phố <span class="text-red-500">*</span></label>
                    <select id="city" class="w-full border border-gray-300 input-field rounded-xl px-4 py-3 bg-white">
                        <option value="" selected disabled>Đang tải danh sách...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-800 font-bold mb-2">Phường / Xã <span class="text-red-500">*</span></label>
                    <select id="ward" disabled class="w-full border border-gray-300 input-field rounded-xl px-4 py-3 bg-white transition-colors">
                        <option value="" selected disabled>-- Vui lòng chọn Quận trước --</option>
                    </select>
                </div>

            </div>

            <div class="space-y-6">

                <div>
                    <label class="block text-gray-800 font-bold mb-2">Quận / Huyện <span class="text-red-500">*</span></label>
                    <select id="district" disabled class="w-full border border-gray-300 input-field rounded-xl px-4 py-3 bg-white transition-colors">
                        <option value="" selected disabled>-- Vui lòng chọn Tỉnh trước --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-800 font-bold mb-2">Số nhà, tên đường</label>
                    <input type="text" id="street" placeholder="VD: 123 Nguyễn Huệ (Không bắt buộc)"
                           class="w-full border border-gray-300 input-field rounded-xl px-4 py-3">
                </div>
            </div>
        </div>

        <div class="bg-gray-50 p-6 rounded-xl border border-gray-200 mb-8">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <label class="block text-gray-800 font-bold mb-1">Bán kính nhận việc (km)</label>
                    <p class="text-sm text-gray-500">Hệ thống sẽ quét việc trong vòng tròn này.</p>
                </div>
                <div class="flex items-center gap-3">
                    <button type="button" onclick="adjustRadius(-1)" class="w-10 h-10 rounded-full bg-white border hover:bg-gray-100 font-bold text-xl text-gray-600">-</button>

                    <input type="number" id="work_radius" value="5" min="1" max="50"
                           class="w-20 border border-primary-400 input-field rounded-xl px-2 py-3 text-center font-bold text-xl text-primary-400 bg-white">

                    <button type="button" onclick="adjustRadius(1)" class="w-10 h-10 rounded-full bg-white border hover:bg-gray-100 font-bold text-xl text-gray-600">+</button>
                    <span class="font-bold text-gray-600">km</span>
                </div>
            </div>
        </div>

        <button type="button" id="btn-search-map"
                class="w-full mb-6 border-2 border-dashed border-primary-400 text-primary-600 py-3 rounded-xl font-bold hover:bg-green-50 transition-colors flex justify-center items-center gap-2">
            <span>📍</span> Cập nhật vị trí & Vùng hoạt động
        </button>

        <div id="map" class="relative mb-8 rounded-xl shadow-inner"></div>

        <input type="hidden" id="result_city" name="city">
        <input type="hidden" id="result_district" name="district">
        <input type="hidden" id="result_ward" name="ward">
        <input type="hidden" id="result_lat" name="lat">
        <input type="hidden" id="result_lng" name="lng">
        <input type="hidden" id="result_radius" name="radius" value="5">

        <button type="submit" class="w-full bg-[#68A776] text-white py-4 rounded-xl text-xl font-bold hover:bg-[#5a9166] transition-transform hover:scale-[1.01] shadow-lg">
            Hoàn tất đăng ký
        </button>
    </form>
</div>

<script>
    function adjustRadius(delta) {
        const input = document.getElementById('work_radius');
        let val = parseInt(input.value) || 5;
        val += delta;
        if (val < 1) val = 1;
        if (val > 50) val = 50;
        input.value = val;
        input.dispatchEvent(new Event('input'));
    }

    document.addEventListener('DOMContentLoaded', function() {
        const defaultCoords = [10.8231, 106.6297];
        const map = L.map('map').setView(defaultCoords, 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

        const marker = L.marker(defaultCoords, { draggable: true }).addTo(map);
        let workCircle = L.circle(defaultCoords, { color: '#68A776', fillColor: '#ACCFB2', fillOpacity: 0.4, radius: 5000 }).addTo(map);

        function updateCircle() {
            const latLng = marker.getLatLng();
            const radiusMeters = document.getElementById('work_radius').value * 1000;
            workCircle.setLatLng(latLng);
            workCircle.setRadius(radiusMeters);
        }

        async function moveMapTo(query, zoomLevel) {
            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
                const res = await fetch(url);
                const data = await res.json();

                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    const newLatLng = new L.LatLng(lat, lon);

                    marker.setLatLng(newLatLng);
                    map.setView(newLatLng, zoomLevel);
                    updateCircle();

                    document.getElementById('result_lat').value = lat;
                    document.getElementById('result_lng').value = lon;
                    console.log(`Đã bay tới: ${query}`);
                }
            } catch (e) { console.error("Lỗi tìm map:", e); }
        }

        const host = "https://provinces.open-api.vn/api/";
        const elCity = document.getElementById('city');
        const elDistrict = document.getElementById('district');
        const elWard = document.getElementById('ward');

        fetch(host + "?depth=1").then(res => res.json()).then(data => {
            let html = '<option value="" selected disabled>Chọn Tỉnh / Thành phố</option>';
            data.forEach(item => html += `<option value="${item.code}" data-name="${item.name}">${item.name}</option>`);
            elCity.innerHTML = html;
        });

        elCity.addEventListener('change', function() {
            const cityName = this.options[this.selectedIndex].getAttribute('data-name');
            document.getElementById('result_city').value = cityName;

            moveMapTo(cityName, 10);

            elDistrict.innerHTML = '<option value="" selected disabled>Đang tải...</option>';
            elDistrict.disabled = true;
            elWard.innerHTML = '<option value="" selected disabled>-- Vui lòng chọn Quận trước --</option>';
            elWard.disabled = true;

            fetch(host + "p/" + this.value + "?depth=2").then(res => res.json()).then(data => {
                let html = '<option value="" selected disabled>Chọn Quận / Huyện</option>';
                data.districts.forEach(item => html += `<option value="${item.code}" data-name="${item.name}">${item.name}</option>`);
                elDistrict.innerHTML = html;
                elDistrict.disabled = false;
            });
        });

        elDistrict.addEventListener('change', function() {
            const distName = this.options[this.selectedIndex].getAttribute('data-name');
            const cityName = document.getElementById('result_city').value;
            document.getElementById('result_district').value = distName;

            moveMapTo(`${distName}, ${cityName}`, 13);

            elWard.innerHTML = '<option value="" selected disabled>Đang tải...</option>';
            elWard.disabled = true;

            fetch(host + "d/" + this.value + "?depth=2").then(res => res.json()).then(data => {
                let html = '<option value="" selected disabled>Chọn Phường / Xã</option>';
                data.wards.forEach(item => html += `<option value="${item.code}" data-name="${item.name}">${item.name}</option>`);
                elWard.innerHTML = html;
                elWard.disabled = false;
            });
        });

        elWard.addEventListener('change', function() {
            const wardName = this.options[this.selectedIndex].getAttribute('data-name');
            const distName = document.getElementById('result_district').value;
            const cityName = document.getElementById('result_city').value;
            document.getElementById('result_ward').value = wardName;

            moveMapTo(`${wardName}, ${distName}, ${cityName}`, 15);
        });

        document.getElementById('work_radius').addEventListener('input', function() {
            updateCircle();
            map.fitBounds(workCircle.getBounds());
            document.getElementById('result_radius').value = this.value;
        });

        document.getElementById('btn-search-map').addEventListener('click', async function() {
            const city = document.getElementById('result_city').value;
            const district = document.getElementById('result_district').value;
            const ward = document.getElementById('result_ward').value;
            const street = document.getElementById('street').value;

            if (!city) { alert("Vui lòng chọn Tỉnh/Thành phố!"); return; }

            if (street) {
                const query = `${street}, ${ward}, ${district}, ${city}`;
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data && data.length > 0) {
                        moveMapTo(query, 17);
                    } else {
                        alert("Không tìm thấy số nhà này, nhưng nó chỉ ở gần đây thôi, bản đồ sẽ giữ nguyên vị trí ở Phường/Xã để bạn tự kéo ghim.");
                    }
                } catch(e) { console.error(e); }
            } else {
                map.fitBounds(workCircle.getBounds());
            }
        });

        marker.on('drag', () => workCircle.setLatLng(marker.getLatLng()));
        marker.on('dragend', () => {
            const pos = marker.getLatLng();
            document.getElementById('result_lat').value = pos.lat;
            document.getElementById('result_lng').value = pos.lng;
            updateCircle();
        });

        document.getElementById('tasker-signup-form-3').addEventListener('submit', async function(e) {
            e.preventDefault();

            const latitude = Number(document.getElementById('result_lat').value);
            const longitude = Number(document.getElementById('result_lng').value);
            const city = document.getElementById('result_city').value;
            const district = document.getElementById('result_district').value;
            const ward = document.getElementById('result_ward').value;
            const radius = Number(document.getElementById('result_radius').value);
            const street = document.getElementById('street').value;
            const full_address = [street, ward, district, city]
                .filter(Boolean)
                .join(', ');

            if (!longitude || !latitude) {
                alert("Đang xác định toạ độ, vui lòng chờ giây lát..."); 
                return;
            }

            const step1 = JSON.parse(localStorage.getItem('tasker_signup_step1'));
            const step2 = JSON.parse(localStorage.getItem('tasker_signup_step2'));

            console.log("step 1: ", step1);
            console.log("step 2: ", step2);
            
            if (!step1 || !step2) {
                alert('Thiếu dữ liệu đăng ký. Vui lòng thực hiện lại.');
                return;
            }

            const payload = {
                ...step1,
                ...step2,

                working_area: {
                    full_address,
                    longitude,
                    latitude,
                },

                working_radius: radius,
            };

            console.log("SIGN UP TASKER PAYLOAD: ", payload);

            try {
                const API_BASE = (typeof window.CONFIG !== 'undefined' && window.CONFIG.API_BASE_URL) ? window.CONFIG.API_BASE_URL : 'http://localhost:3000';
                const response = await fetch(`${API_BASE}/api/auth/signup/tasker`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.message || 'Đăng ký thất bại');
                    return;
                }

                const addressPayload = {
                    user_id: data.user._id,
                    full_address, longitude, latitude,
                    street, ward, district, city,
                    note: "Địa chỉ đăng ký đầu tiên của tasker",
                    is_default: true
                };

                console.log("ADDRESS PAYLOAD: ", addressPayload);
                await addAddress(addressPayload);

                localStorage.removeItem('tasker_signup_step1');
                localStorage.removeItem('tasker_signup_step2');

                alert("Đăng ký thành công! Vui lòng xác thực email.");
                window.location.href = "otp_verifyEmail.html";

            } catch (err) {
                console.error(err);
                alert('Có lỗi xảy ra');
            }
        });
        
        async function addAddress(addressPayload)  {
            try {
                const response = await fetch(`${API_BASE}/api/user/tasker-signup/first-address`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(addressPayload),
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.message || 'Thêm địa chỉ mới thất bại');
                    return;
                }

                return data;

            } catch (err) {
                console.error(err);
                alert('Có lỗi xảy ra');
            }
        }

    });
</script>

</body>
</html>
