<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script async defer
            src="https://maps.googleapis.com/maps/api/js?key=<YOUR_API_KEY>&callback=initMap">
    </script>

    <link rel="stylesheet" type="text/css" href="../../public/css/output.css">
    <link rel="icon" type="image/x-icon" href="../../public/favicons/favicon.ico">

    <title>Đăng ký làm Tasker - Bước 3</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #68A776;
            --accent-color: #ACCFB2;
        }
        .input-field:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 1px var(--primary-color);
        }
        #map {
            height: 250px;
            background-color: #E0E0E0;
            border: 1px solid #D1D5DB;
        }
    </style>
</head>

<body class="bg-gray-100 flex justify-center py-10 font-montserrat min-h-screen">
    <div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-8 border border-gray-200">

        <div class="mb-8">
            <a href="tasker_signup_02.html" class="inline-block p-1 mb-8 -ml-2 text-gray-500 hover:text-dark-900 transition-colors">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 19L8 12L15 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>

            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-primary-400 border-b-2 border-primary-400 pb-2 inline-block">
                    Đăng ký làm Tasker
                </h1>
            </div>
        </div>

        <form id="tasker-signup-form-3">

            <label class="block text-dark-900 font-medium mb-1" for="address">Địa chỉ</label>
            <div class="relative mb-6">
                <input type="text" id="address" name="address" placeholder="Đường xx, Quận/Huyện yy, Thành phố zz"
                    class="w-full border border-gray-300 input-field rounded-xl px-4 py-3 transition-colors" required>
            </div>

            <label class="block text-dark-900 font-medium mb-1">Xác định vị trí của bạn</label>
            <div id="map" class="relative mb-10 rounded-xl">
            </div>

            <button type="submit"
                    class="w-full bg-primary-400 text-white py-3 rounded-xl text-lg font-semibold hover:bg-accent-400 transition-colors">
                Hoàn tất
            </button>
        </form>
    </div>

    <script>
        function initMap() {
            const initialCoords = { lat: 10.8231, lng: 106.6297 };

            const map = new google.maps.Map(document.getElementById("map"), {
                zoom: 12,
                center: initialCoords,
                mapTypeControl: false,
                streetViewControl: false,
            });

            const marker = new google.maps.Marker({
                position: initialCoords,
                map: map,
                draggable: true,
                title: "Vị trí Tasker",
            });

            google.maps.event.addListener(marker, 'dragend', function() {
                const newLat = marker.getPosition().lat();
                const newLng = marker.getPosition().lng();
                console.log('Vị trí mới:', newLat, newLng);
            });
        }

        document.getElementById('tasker-signup-form-3').addEventListener('submit', async function(e) {
            e.preventDefault();

            const step1 = JSON.parse(localStorage.getItem('tasker_signup_step1'));
            const step2 = JSON.parse(localStorage.getItem('tasker_signup_step2'));

            console.log("step 1: ", step1);
            console.log("step 2: ", step2);
            
            if (!step1 || !step2) {
                alert('Thiếu dữ liệu đăng ký. Vui lòng thực hiện lại.');
                return;
            }

            const payload = {
                ...step1,
                ...step2,
                working_area: document.getElementById('address').value,
                location: {
                    lat: window.selectedLat,
                    lng: window.selectedLng,
                }
            };

            try {
                const response = await fetch('http://localhost:3000/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.message || 'Đăng ký thất bại');
                    return;
                }

                localStorage.removeItem('tasker_signup_step1');
                localStorage.removeItem('tasker_signup_step2');

                alert("Đăng ký thành công! Vui lòng xác thực email.");
                window.location.href = "otp_verifyEmail.html";

            } catch (err) {
                console.error(err);
                alert('Có lỗi xảy ra');
            }
        });
    </script>

</body>
</html>
