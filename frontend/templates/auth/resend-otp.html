<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="../../public/css/output.css">
    <link rel="icon" type="image/x-icon" href="../../public/favicons/favicon.ico">

    <title>Kích hoạt tài khoản</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="bg-gray-100 flex justify-center py-10 font-montserrat">

<div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-8 border border-gray-200">

    <div class="mb-6">
        <a href="login-signup.html" class="inline-block p-1 mb-6 -ml-2 text-gray-500 hover:text-dark-900 transition-colors">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 19L8 12L15 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>

        <h1 class="text-2xl font-bold text-dark-900">Kích hoạt tài khoản</h1>
        <p class="text-gray-500 text-sm mt-3 mb-35">
            Vui lòng nhập email đã đăng ký
        </p>
    </div>

    <form id="resent-otp-form">

        <label class="block text-dark-900 font-medium mb-1" for="contact-input">Email</label>
        <input type="text" id="email-input" name="email"
               placeholder="email@example.com"
               class="w-full border border-gray-300 rounded-xl px-4 py-3 mb-6" required>

        <button type="submit"
                class="w-full bg-primary-400 text-white py-3 rounded-xl text-lg font-semibold mb-4 hover:bg-primary-500 transition-colors">
            Gửi lại mã xác thực
        </button>

    </form>

    <div class="text-center mt-6">
        <a href="login-signup.html" class="text-primary-400 font-medium">Quay lại Đăng nhập</a>
    </div>

</div>

<script>
    document.getElementById('resent-otp-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email-input').value.trim();
        if (!email) {
            alert('Vui lòng nhập email.');
            return;
        }

        try {
            const API_BASE = (typeof window.CONFIG !== 'undefined' && window.CONFIG.API_BASE_URL) ? window.CONFIG.API_BASE_URL : 'http://localhost:3000';
            const response = await fetch(`${API_BASE}/api/auth/resend-otp`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email: email })
            });

            const data = await response.json();
            if (!response.ok) {
                alert(data.message || "Không thể gửi lại mã OTP");
                return;
            }

            alert("Mã xác thực đã được gửi lại. Vui lòng kiểm tra email.");
            window.location.href = `otp_verifyEmail.html?type=email&contact=${encodeURIComponent(email)}`;

        } catch (error) {
            console.error("Resend OTP error:", error);
            alert("Có lỗi khi kết nối server");
        }
    });
</script>

</body>
</html>
