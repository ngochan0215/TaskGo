<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" href="../../public/css/output.css">
    <link rel="icon" type="image/x-icon" href="../../public/favicons/favicon.ico">

    <title>Xác thực email</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #68A776;
            --accent-color: #ACCFB2;
        }

        .otp-input {
          width: 50px;
          height: 50px;
          text-align: center;
          font-size: 1.5rem;
          font-weight: 600;
          border: 1px solid #D1D5DB;
          border-radius: 0.75rem;
          transition: border-color 0.2s;
        }
        .otp-input:focus {
          border-color: var(--primary-color);
          outline: none;
        }
        @media (max-width: 400px) {
            .otp-input {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body class="bg-gray-100 flex justify-center py-10 font-montserrat min-h-screen">

<div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-8 border border-gray-200">

    <div class="mb-6">
        <a href="login-signup.html" class="inline-block p-1 mb-6 -ml-2 text-gray-500 hover:text-dark-900 transition-colors">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 19L8 12L15 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>

        <h1 class="text-2xl font-bold text-dark-900 mb-3" id="otp-title">Xác thực email</h1>
        <p class="text-gray-500 text-sm mb-8" id="otp-instruction">
            Vui lòng nhập mã gồm 6 chữ số đã được gửi cho bạn.
        </p>
        <p class="text-gray-500 text-sm mb-8" id="otp-instruction">
            Mã có hiệu lực trong 1h kể từ khi email được gửi.
        </p>
    </div>

    <form id="otp-form">
        <div class="flex justify-center gap-3 mb-8">
            <input type="text" id="otp-1" maxlength="1" class="otp-input" inputmode="numeric">
            <input type="text" id="otp-2" maxlength="1" class="otp-input" inputmode="numeric">
            <input type="text" id="otp-3" maxlength="1" class="otp-input" inputmode="numeric">
            <input type="text" id="otp-4" maxlength="1" class="otp-input" inputmode="numeric">
            <input type="text" id="otp-5" maxlength="1" class="otp-input" inputmode="numeric">
            <input type="text" id="otp-6" maxlength="1" class="otp-input" inputmode="numeric">
        </div>

        <button type="submit"
                class="w-full bg-primary-400 text-white py-3 rounded-xl text-lg font-semibold mb-6 hover:bg-accent-400 transition-colors">
            Xác nhận
        </button>
    </form>

    <div class="text-center">
        <p class="text-gray-500 text-sm inline">
            Chưa nhận được mã?
        </p>
        <button id="resend-otp" class="text-primary-400 font-medium disabled:text-gray-400" disabled>
            Gửi lại sau (<span id="countdown">60s</span>)
        </button>
    </div>

</div>

<script>
    const OTP_LENGTH = 6;

    function getUrlParameter(name) {
        name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
        var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
        var results = regex.exec(location.search);
        return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
    };

    const flow = getUrlParameter('flow');
    const type = getUrlParameter('type');
    const contact = getUrlParameter('contact');
    const otpTitle = document.getElementById('otp-title');
    const otpInstruction = document.getElementById('otp-instruction');

    if (type === 'email') {
        otpTitle.textContent = 'Kiểm tra email của bạn';
        otpInstruction.innerHTML = `Mã xác thực đã được gửi đến <span class="font-semibold text-dark-900">${contact}</span>. Vui lòng nhập mã gồm ${OTP_LENGTH} chữ số`;
    } else if (type === 'phone') {
        otpTitle.textContent = 'Kiểm tra tin nhắn của bạn';
        otpInstruction.innerHTML = `Mã xác thực đã được gửi đến <span class="font-semibold text-dark-900">${contact}</span>. Vui lòng nhập mã gồm ${OTP_LENGTH} chữ số`;
    } else {
        otpTitle.textContent = 'Nhập mã xác thực';
        otpInstruction.textContent = `Vui lòng nhập mã gồm ${OTP_LENGTH} chữ số đã được gửi cho bạn.`;
    }

    const otpInputs = [];
    for(let i = 1; i <= OTP_LENGTH; i++) {
        otpInputs.push(document.getElementById(`otp-${i}`));
    }

    otpInputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            input.value = input.value.replace(/[^0-9]/g, '');

            if (input.value && index < otpInputs.length - 1) {
                otpInputs[index + 1].focus();
            }
            if (index === otpInputs.length - 1 && input.value) {
                document.getElementById('otp-form').dispatchEvent(new Event('submit'));
            }
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && input.value === '' && index > 0) {
                otpInputs[index - 1].focus();
            }
        });
    });

    const resendButton = document.getElementById('resend-otp');
    const countdownSpan = document.getElementById('countdown');
    let countdownTime = 60;

    function startCountdown() {
        countdownTime = 60;
        resendButton.disabled = true;
        resendButton.classList.add('disabled:text-gray-400');

        const timer = setInterval(() => {
            countdownTime--;
            countdownSpan.textContent = countdownTime;

            if (countdownTime <= 0) {
                clearInterval(timer);
                resendButton.disabled = false;
                resendButton.classList.remove('disabled:text-gray-400');
                countdownSpan.textContent = 'Gửi lại';
            }
        }, 1000);
    }

    startCountdown();

    resendButton.addEventListener('click', () => {
        if (!resendButton.disabled) {
            console.log('Yêu cầu gửi lại mã OTP đã được gửi cho:', contact);
            startCountdown();
        }
    });

    document.getElementById('otp-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const otpCode = otpInputs.map(input => input.value).join('');

        if (otpCode.length !== OTP_LENGTH) {
            alert(`Vui lòng nhập đủ ${OTP_LENGTH} chữ số.`);
            return;
        }

        try {
            let response;
            if (flow === 'change-email') {
                response = await fetch(
                    'http://localhost:3000/api/user/profile/change-email/verify-otp',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('token')}`
                        },
                        body: JSON.stringify({ otp: otpCode })
                    }
                );
            }
            else {
                response = await fetch("http://localhost:3000/api/auth/verify-email", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ code: otpCode })
                });
            }

            const data = await response.json();

            if (!response.ok) {
                alert(data.message || 'OTP không hợp lệ');
                return;
            }

            alert('Xác thực thành công');
            window.location.href = 'login-signup.html';

        } catch (error) {
            console.error("Verify email error:", error);
            alert("Không thể xác thực email. Vui lòng thử lại sau.");
        }
    });

</script>

</body>
</html>
