<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="../../public/css/output.css">
    <link rel="icon" type="image/x-icon" href="../../public/favicons/favicon.ico">

    <title>Đăng ký làm Tasker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #68A776;
            --accent-color: #ACCFB2;
        }
        .input-field:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 1px var(--primary-color);
        }
    </style>

<body class="bg-gray-100 flex justify-center py-10 font-montserrat min-h-screen">

    <div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-8 border border-gray-200">

        <div class="mb-8">
            <a href="login-signup.html" class="inline-block p-1 mb-8 -ml-2 text-gray-500 hover:text-dark-900 transition-colors">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 19L8 12L15 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>

            <div class="text-center">
                <h1 class="text-2xl font-bold text-primary-400 border-b-2 border-primary-400 pb-2 inline-block">
                    Đăng ký làm Tasker
                </h1>
            </div>
        </div>

        <form id="tasker-signup-form-1">

            <label class="block text-dark-900 font-medium mb-1" for="phone">Số điện thoại</label>
            <div class="relative mb-6">
                <input type="tel" id="phone" name="phone" placeholder="0123456789"
                    class="w-full border border-gray-300 input-field rounded-xl px-4 py-3 transition-colors" required>
            </div>

            <label class="block text-dark-900 font-medium mb-1" for="email">Email</label>
            <div class="relative mb-6">
                <input type="email" id="email" name="email" placeholder="example@gmail.com"
                    class="w-full border border-gray-300 input-field rounded-xl px-4 py-3 transition-colors" required>
            </div>

            <label class="block text-dark-900 font-medium mb-1" for="name">Họ tên</label>
            <div class="relative mb-6">
                <input type="text" id="name" name="name" placeholder="Nguyễn Văn A"
                    class="w-full border border-gray-300 input-field rounded-xl px-4 py-3 transition-colors" required>
            </div>

            <label class="block text-dark-900 font-medium mb-1">Căn cước công dân</label>
            <input id="CCCD" type="text" placeholder="0513xxxxyyyy" required
                class="w-full border border-gray-300 rounded-xl px-4 py-3 mb-6">

            <label class="block text-dark-900 font-medium mb-1">Mật khẩu</label>
            <div class="relative mb-1">
                <input type="password" id="password" placeholder="**********" required
                    class="w-full border border-accent-300 rounded-xl px-4 py-3 mb-4">

                <button type="button" id="toggle-password-signup" class="absolute right-4 top-3 text-gray-400 p-0 leading-none">

.58678 11.0706 7.74987L7.7498 11.0707C7.58671 10.7372 7.50124 10.3711 7.4998 9.99987ZM17.9723 11.2782C16.8606 13.0832 14.3481 16.1207 9.9998 16.1207C8.61624 16.1285 7.2521 15.795 6.02813 15.1499L7.70563 13.4724C8.50569 14.0035 9.46488 14.2415 10.4204 14.146C11.376 14.0505 12.2691 13.6273 12.9481 12.9482C13.6272 12.2692 14.0504 11.3761 14.1459 10.4205C14.2415 9.46495 14.0035 8.50576 13.4723 7.70571L15.3973 5.78071C16.418 6.60594 17.2891 7.60075 17.9723 8.72154C18.2097 9.10567 18.3354 9.54831 18.3354 9.99987C18.3354 10.4514 18.2097 10.8941 17.9723 11.2782Z" fill="currentColor"/>

                </svg>
                </button>
            </div>

            <label class="block text-dark-900 font-medium mb-1" for="experience">Kinh nghiệm làm việc</label>
            <div class="relative mb-8">
                <textarea id="experience" name="experience" rows="4"
                        placeholder="Mô tả kinh nghiệm của bạn (ví dụ: đã làm việc 2 năm trong lĩnh vực vệ sinh công nghiệp)"
                        class="w-full border border-gray-300 input-field rounded-xl px-4 py-3 transition-colors" required></textarea>
            </div>

            <div id="signup-error" class="text-red-500 text-sm mb-4 hidden bg-red-100 p-3 rounded-lg border border-red-300">
            </div>

            <button type="submit"
                    class="w-full bg-primary-400 text-white py-3 rounded-xl text-lg font-semibold hover:bg-accent-400 transition-colors">
                Tiếp tục
            </button>
        </form>
    </div>

    <script>
        const signupErrorMsg = document.getElementById('signup-error');
        const passwordInputSignup = document.getElementById('password');
        const togglePasswordSignup = document.getElementById('toggle-password-signup');
        const eyeOpenIcon = document.getElementById('eye-open-icon');
        const eyeSlashIcon = document.getElementById('eye-slash-icon');

        function togglePassword(input) {
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';

            eyeOpenIcon.classList.toggle('hidden', !isPassword);
            eyeSlashIcon.classList.toggle('hidden', isPassword);
        }

        togglePasswordSignup.addEventListener('click', () => togglePassword(passwordInputSignup));

        function showErrorMessage(message) {
            signupErrorMsg.textContent = message;
            signupErrorMsg.classList.remove('hidden');
        }

        function hideErrorMessage() {
            signupErrorMsg.classList.add('hidden');
            signupErrorMsg.textContent = '';
        }

        // ====== VALIDATION ======
        function validateInput({ email, password, phone, identification }) {
            const errors = {};

            if (phone !== undefined) {
                const phoneRegex = /^(0|\+84)(3|5|7|8|9)[0-9]{8}$/;
                if (!phone) 
                    errors.phone = "Vui lòng nhập số điện thoại.";
                else if (!phoneRegex.test(phone))
                    errors.phone = "Số điện thoại không hợp lệ.";
            }

            if (!identification) 
                errors.CCCD = "Vui lòng nhập CCCD.";
            else if (!/^\d{12}$/.test(identification))
                errors.CCCD = "CCCD phải gồm 12 số.";

            if (!email) 
                errors.email = "Vui lòng nhập email.";
            else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))
                errors.email = "Email không hợp lệ.";

            if (!password) 
                errors.password = "Vui lòng nhập mật khẩu.";
            else if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/.test(password))
                errors.password = "Mật khẩu phải có tối thiểu 8 ký tự, ít nhất một chữ hoa, một chữ thường, một ký tự đặc biệt và một số.";

            return {
                isValid: Object.keys(errors).length === 0,
                errors
            };
        }

        

        document.getElementById('tasker-signup-form-1').addEventListener('submit', function(e) {
            e.preventDefault();
            hideErrorMessage();

            const data = {
                phone_number: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                full_name: document.getElementById('name').value,
                identification: document.getElementById('CCCD').value,
                introduction: document.getElementById('experience').value,
                password: document.getElementById('password').value,
                role: 'tasker'
            };

            const result = validateInput(data);
            if (!result.isValid) {
                Object.values(result.errors).forEach(showErrorMessage);
                return;
            }

            localStorage.setItem('tasker_signup_step1', JSON.stringify(data));
            window.location.href = 'tasker_signup_02.html';
        });
    </script>
</body>
</html>
