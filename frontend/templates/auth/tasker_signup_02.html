<script>
    let token = localStorage.getItem("token");
    if (!token) {
        alert("Vui lòng đăng nhập");
        location.href = "../auth/login-signup.html";
    }
    console.log("TOKEN: ", token);

    const serviceGrid = document.getElementById("service-grid");

    function renderIcon(iconName) {
        console.log(iconName);
        if (!iconName) return "build";
        return `
            <span class="material-symbols-outlined text-[22px]">
            ${iconName}
            </span>
        `;
    }

    async function loadTasks() {
        const res= await fetch("http://localhost:3000/api/task/all?status=active", 
        {
            headers: {
                Authorization: `Bearer ${token}`
            }
        });

        if (!res.ok) return alert("Không lấy được danh sách các dịch vụ.");
        
        const tasks = await res.json();
        console.log("tasks: ", tasks.tasks);
        renderServices(tasks.tasks);
    }

    function renderServices(tasks) {
        serviceGrid.innerHTML = "";

        tasks.forEach((task, index) => {
            const id = `service-${task._id}`;

            const html = `
            <input
                type="checkbox"
                id="${id}"
                name="services"
                value="${task._id}"
                class="hidden service-checkbox"
            >

            <label
                for="${id}"
                class="service-label flex flex-col items-center p-4 border-2 border-gray-300 rounded-xl cursor-pointer transition-all relative hover:border-primary-400"
            >
                <div class="absolute top-2 right-2 w-5 h-5 rounded-full flex items-center justify-center bg-gray-400 check-icon">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
                    <path d="M5 13L9 17L19 7"
                    stroke="white" stroke-width="3"
                    stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                </div>

                <div class="w-10 h-10 bg-gray-200 rounded-full
                    flex items-center justify-center mb-1 text-gray-700">
                    ${renderIcon(task.icon)}
                </div>

                <span class="text-sm font-semibold text-center">
                ${task.task_name}
                </span>
            </label>
            `;

            serviceGrid.insertAdjacentHTML("beforeend", html);
        });

        bindServiceCheckboxEvents();
    }

    function bindServiceCheckboxEvents() {
        document.querySelectorAll('.service-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
            const label = this.nextElementSibling;
            const checkIcon = label.querySelector('.check-icon');

            if (this.checked) {
                label.classList.remove('border-gray-300');
                label.classList.add('border-primary-400');
                label.style.backgroundColor = 'var(--accent-color)';
                checkIcon.style.backgroundColor = 'var(--primary-color)';
            } else {
                label.classList.remove('border-primary-400');
                label.classList.add('border-gray-300');
                label.style.backgroundColor = 'white';
                checkIcon.style.backgroundColor = '#9CA3AF';
            }
            });
        });
    }

    document.getElementById('tasker-signup-form-2').addEventListener('submit', function(e) {
        e.preventDefault();

        const services = Array.from(
            document.querySelectorAll('input[name="services"]:checked')
        ).map(cb => cb.value);

        localStorage.setItem(
            'tasker_signup_step2',
            JSON.stringify({ services })
        );
        console.log("tasker_signup_step2: ", services);
        window.location.href = 'tasker_signup_03.html';
    });

    document.querySelectorAll('.service-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', function() {
            const label = this.nextElementSibling;
            const checkIcon = label.querySelector('.check-icon');

            if (this.checked) {
                label.classList.remove('border-gray-300');
                label.classList.add('border-primary-400');
                label.style.backgroundColor = 'var(--accent-color)';
                checkIcon.style.backgroundColor = 'var(--primary-color)';
            } else {
                label.classList.remove('border-primary-400');
                label.classList.add('border-gray-300');
                label.style.backgroundColor = 'white';
                checkIcon.style.backgroundColor = '#9CA3AF';
            }
        });
    });

    loadTasks();
</script>
