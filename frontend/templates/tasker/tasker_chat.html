<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskGo - Tin nhắn dịch vụ</title>

    <link rel="stylesheet" href="../../public/css/output.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="icon" type="image/x-icon" href="../../public/favicons/favicon.ico">
    <script src="../../components/tasker_header.js" defer></script>
    <script src="../../components/tasker_footer.js" defer></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #A5B4FC; border-radius: 10px; }

        @keyframes ripple {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.3); }
            70% { box-shadow: 0 0 0 20px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }
        .calling-animation {
            animation: ripple 2s infinite;
        }

        #message-container .bg-green-500,
        #btn-send.bg-green-500,
        #chat-header-status.bg-green-500 {
            background-color: #3730A3 !important; /* Tím đậm */
            color: white !important;
            border-color: #3730A3 !important;
        }

        .hover\:bg-green-600:hover {
            background-color: #312E81 !important;
        }

        .bg-green-50 { background-color: #EEF2FF !important; }
        .border-green-500 { border-color: #3730A3 !important; }
        .focus-within\:border-green-500:focus-within { border-color: #3730A3 !important; }
        .focus-within\:ring-green-200:focus-within { --tw-ring-color: #C7D2FE !important; }

        .text-green-600,
        .text-green-500,
        #chat-typing-indicator {
            color: #3730A3 !important;
        }

        #btn-call {
            background-color: #EEF2FF !important;
            color: #3730A3 !important;
            transition: all 0.2s ease;
        }

        #btn-call:hover {
            background-color: #3730A3 !important;
            color: white !important;
            transform: scale(0.95);
        }

        #btn-call span {
            color: inherit !important;
        }

        .text-green-500.animate-spin { color: #3730A3 !important; }
    </style>

    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="../js/tasker_chat.js" defer></script>
</head>

<body class="bg-[#E0E7FF] h-screen w-full overflow-hidden font-montserrat flex flex-col">

<tasker-header active="chat" heading="Tin nhắn"></tasker-header>

<main class="flex-1 flex flex-col min-h-0 w-full max-w-[1440px] mx-auto md:p-4">

    <div class="flex-1 bg-white md:rounded-2xl shadow-sm border border-gray-200 flex overflow-hidden w-full h-full relative">

        <aside class="w-[80px] md:w-[320px] flex-none border-r border-gray-100 flex flex-col bg-white">
            <div class="p-4 border-b border-gray-100 h-[70px] flex items-center shrink-0">
                <h2 class="hidden md:block font-bold text-xl text-dark-900">Tin nhắn</h2>
            </div>
            <div id="conversations-list" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1">
                <p class="text-center text-gray-400 text-sm mt-4 hidden md:block">Đang tải danh sách...</p>
            </div>
        </aside>

        <section class="flex-1 flex flex-col bg-white min-w-0 relative">

            <div id="call-overlay" class="hidden absolute inset-0 z-50 bg-gray-900/95 backdrop-blur-md flex flex-col items-center justify-center transition-all duration-300">

                <div class="relative mb-8">
                    <div class="w-36 h-36 rounded-full p-1 border-4 border-white/20 calling-animation">
                        <img id="call-partner-avatar" src="https://i.pravatar.cc/150?img=11" class="w-full h-full rounded-full object-cover shadow-2xl">
                    </div>
                </div>

                <h3 class="text-3xl font-bold text-white mb-2 tracking-tight" id="call-partner-name">...</h3>
                <p class="text-indigo-300 font-medium mb-16 flex items-center gap-2 text-lg">
                    <span class="material-symbols-outlined text-[20px] animate-spin">sync</span>
                    Đang kết nối...
                </p>

                <div class="flex items-center gap-10">
                    <div class="flex flex-col items-center gap-2">
                        <button id="btn-toggle-mic" class="w-16 h-16 rounded-full bg-white/10 text-white flex items-center justify-center hover:bg-white/20 transition backdrop-blur-sm">
                            <span class="material-symbols-outlined text-[28px]">mic_off</span>
                        </button>
                        <span class="text-xs text-gray-400">Mic</span>
                    </div>

                    <div class="flex flex-col items-center gap-2">
                        <button id="btn-end-call" class="w-20 h-20 rounded-full bg-red-500 text-white flex items-center justify-center shadow-lg hover:bg-red-600 transition transform hover:scale-110 active:scale-95 border-4 border-gray-900">
                            <span class="material-symbols-outlined text-[40px]">call_end</span>
                        </button>
                        <span class="text-xs text-gray-400">Kết thúc</span>
                    </div>

                    <div class="flex flex-col items-center gap-2">
                        <button id="btn-toggle-camera" class="w-16 h-16 rounded-full bg-white/10 text-white flex items-center justify-center hover:bg-white/20 transition backdrop-blur-sm">
                            <span class="material-symbols-outlined text-[28px]">videocam</span>
                        </button>
                        <span class="text-xs text-gray-400">Camera</span>
                    </div>
                </div>
            </div>

            <div class="px-4 md:px-6 h-[70px] border-b border-gray-100 flex items-center justify-between shrink-0 bg-white z-10">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="relative shrink-0 w-10 h-10">
                        <img id="chat-header-avatar" src="https://i.pravatar.cc/150?img=11" class="w-full h-full rounded-full object-cover border border-gray-200">
                        <div id="chat-header-status" class="hidden absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 border-2 border-white rounded-full"></div>
                    </div>
                    <div>
                        <h3 id="chat-header-name" class="font-bold text-dark-900 text-sm">Chọn một hội thoại</h3>
                        <div id="chat-header-score" class="flex items-center gap-1 mt-0.5 empty:hidden"></div>
                        <div id="chat-typing-indicator" class="hidden text-xs text-green-500 font-medium animate-pulse">Đang nhập...</div>
                    </div>
                </div>

                <button id="btn-call" class="w-9 h-9 rounded-full flex items-center justify-center shadow-sm active:scale-95">
                    <span class="material-symbols-outlined text-[20px]">call</span>
                </button>
            </div>

            <div id="message-container" class="flex-1 p-4 md:p-6 overflow-y-auto custom-scrollbar flex flex-col bg-[#FAFAFA]">
                <div id="loading-history" class="hidden w-full flex justify-center py-2 mb-2">
                    <span class="material-symbols-outlined animate-spin text-green-500">progress_activity</span>
                </div>
                <div class="flex h-full items-center justify-center text-gray-400">
                    <p>Chọn đơn hàng để bắt đầu chat</p>
                </div>
            </div>

            <div class="p-4 bg-white border-t border-gray-100 shrink-0">
                <div class="flex items-center gap-2 md:gap-3 bg-gray-50 px-2 py-2 rounded-full border border-gray-200 focus-within:border-green-500 focus-within:ring-1 focus-within:ring-green-200 transition-all">
                    <input id="message-input" type="text" placeholder="Nhập tin nhắn..." class="flex-1 bg-transparent border-none px-3 py-1 text-sm text-dark-900 focus:outline-none placeholder-gray-400 focus:ring-0" autocomplete="off" disabled>
                    <button id="btn-send" class="w-9 h-9 rounded-full bg-green-500 text-white flex items-center justify-center shadow-md hover:bg-green-600 transition active:scale-95 shrink-0">
                        <span class="material-symbols-outlined text-[18px] ml-0.5">send</span>
                    </button>
                </div>
            </div>
        </section>
    </div>
</main>
<tasker-footer></tasker-footer>
<div id="edit-message-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeEditModal()"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md">
        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full flex items-center justify-center">
                    <span class="material-symbols-outlined text-green-600 text-[20px]">edit</span>
                </div>
                <h3 class="font-bold text-lg text-dark-900">Chỉnh sửa tin nhắn</h3>
            </div>
            <button onclick="closeEditModal()"><span class="material-symbols-outlined text-gray-400">close</span></button>
        </div>
        <div class="p-5">
            <textarea id="edit-message-input" class="w-full h-32 px-4 py-3 border border-gray-200 rounded-xl text-sm focus:border-green-500 focus:ring-0 outline-none"></textarea>
        </div>
        <div class="flex items-center justify-end gap-3 px-5 py-4 border-t border-gray-100 bg-gray-50 rounded-b-2xl">
            <button onclick="closeEditModal()" class="px-5 py-2.5 text-sm font-medium border rounded-xl">Hủy</button>
            <button onclick="saveEditedMessage()" class="px-5 py-2.5 text-sm font-medium text-white bg-green-500 hover:bg-green-600 rounded-xl">Lưu thay đổi</button>
        </div>
    </div>
</div>

</body>
</html>
