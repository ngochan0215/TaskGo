<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskGo - Chi tiết dịch vụ</title>

    <link
      rel="stylesheet"
      type="text/css"
      href="../../../public/css/output.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../../public/favicons/favicon.ico"
    />

    <style>
      .active-btn {
        background-color: #22c55e;
        color: white;
        border-color: #22c55e;
      }
    </style>
    <script src="../../../components/cus_header.js" defer></script>
    <script src="../../../components/cus_footer.js" defer></script>
  </head>

  <body class="bg-primary-100 min-h-screen font-montserrat flex flex-col">
    <app-header active="home" heading="Chi tiết dịch vụ"></app-header>
    <main class="p-4 space-y-4 pb-28">
      <div class="bg-white rounded-xl shadow-md p-4 space-y-4">
        <div class="flex items-center justify-between border-b pb-2">
          <h2 id="serviceName" class="text-2xl font-bold text-primary-500">
            Giặt ủi
          </h2>
        </div>

        <p class="text-base mb-2">
          Đây là dịch vụ giặt ủi với các tuỳ chọn 1 giờ, 2 giờ, 3 giờ. Bao gồm 1
          hoặc nhiều các công việc:
        </p>

        <ul class="list-disc pl-5 space-y-2 text-sm text-dark-300 mb-2">
          <li>Phân loại quần áo sáng màu, tối màu</li>
          <li>Giặt quần áo</li>
          <li>Phơi quần áo</li>
          <li>Ủi quần áo</li>
          <li>Xếp quần áo</li>
        </ul>

        <div class="space-y-3">
          <h3 class="text-lg font-bold text-dark-900">Chọn số giờ</h3>

          <div id="hour-group" class="grid grid-cols-3 gap-3">
            <button class="hour-btn hour-btn-hover" data-hours="1">
              1 giờ
            </button>
            <button class="hour-btn hour-btn-hover" data-hours="2">
              2 giờ
            </button>
            <button class="hour-btn hour-btn-hover" data-hours="3">
              3 giờ
            </button>
          </div>
        </div>

        <div
          id="price-summary"
          class="flex justify-between items-center bg-primary-400 rounded-xl p-4 text-primary transition-all duration-300 transform"
        >
          <div>
            <p class="text-xs opacity-80">Tổng tiền tạm tính</p>
            <p id="total-price" class="text-2xl font-bold">0đ</p>
            <p id="totalTimeText" class="text-xs mt-1 opacity-90">0 giờ</p>
          </div>
          <span class="material-symbols-outlined text-4xl">payments</span>
        </div>

        <div class="flex space-x-4">
          <button
            onclick="handleBookingNow()"
            class="action-btn action-btn-hover"
          >
            Đặt ngay
          </button>

          <button
            onclick="handleScheduledBooking()"
            class="action-btn action-btn-hover"
          >
            Đặt lịch trước
          </button>
        </div>
      </div>
    </main>

    <app-footer></app-footer>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module">
      import { initSocket } from "../../js/socket.js";
      initSocket();
    </script>

    <script>
      const formatCurrency = (v) => v.toLocaleString("vi-VN") + "đ";

      function animatePrice() {
        const box = document.getElementById("price-summary");
        box.classList.add("scale-105");
        setTimeout(() => box.classList.remove("scale-105"), 150);
      }

      const urlParams = new URLSearchParams(window.location.search);
      const basePrice = Number(urlParams.get("price")) || 100000;
      const task_id = urlParams.get("id");

      let task_name = "Giặt ủi";
      let task_unit = "giờ";

      let selectedHours = 0;
      let final_amount = 0;

      async function getTaskDetail() {
        try {
          const token = localStorage.getItem("token");
          if (!token) {
            alert("Vui lòng đăng nhập");
            location.href = "../../auth/login-signup.html";
            return;
          }

          const API_BASE = (typeof window.CONFIG !== 'undefined' && window.CONFIG.API_BASE_URL) ? window.CONFIG.API_BASE_URL : 'http://localhost:3000';
          const res = await fetch(`${API_BASE}/api/task/${task_id}`, {
            headers: { Authorization: `Bearer ${token}` },
          });

          if (res.status === 401) {
            localStorage.removeItem("token");
            alert(
              "Token đã hết hạn hoặc không hợp lệ! Vui lòng đăng nhập lại.",
            );
            window.location.href = "../../auth/login-signup.html";
            return;
          }

          const data = await res.json();
          if (!data?.success) return;

          task_name = data.task.task_name || task_name;
          task_unit = data.task.unit || task_unit;

          const nameEl = document.getElementById("serviceName");
          if (nameEl) nameEl.textContent = task_name;
        } catch (err) {
          console.error("Load services failed", err);
        }
      }

      if (task_id) getTaskDetail();

      const hourButtons = document.querySelectorAll("#hour-group .hour-btn");
      hourButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          hourButtons.forEach((b) => b.classList.remove("active-btn"));
          btn.classList.add("active-btn");

          selectedHours = Number(btn.dataset.hours);
          final_amount = basePrice * selectedHours;

          document.getElementById("total-price").textContent =
            formatCurrency(final_amount);
          document.getElementById("totalTimeText").textContent =
            `${selectedHours} giờ`;

          animatePrice();
        });
      });

      function saveDraft(bookingType) {
        const bookingDraft = {
          task_id,
          type: bookingType,
          base_amount: final_amount,
          final_amount: final_amount,

          task_snapshot: {
            code: "LAUNDRY",
            name: task_name,
            pricing: basePrice,
            unit: task_unit,
          },

          task_payload: {
            hours: selectedHours,
            total_time: selectedHours * 60,
            final_amount: final_amount,
          },

          note: "",
        };

        localStorage.setItem("bookingDraft", JSON.stringify(bookingDraft));
        console.log("BOOKING DRAFT:", bookingDraft);
      }

      function handleBookingNow() {
        if (!selectedHours) {
          alert("Vui lòng chọn số giờ giặt ủi!");
          return;
        }
        saveDraft("immediate");
        window.location.href = "../book_now.html";
      }

      function handleScheduledBooking() {
        if (!selectedHours) {
          alert("Vui lòng chọn số giờ giặt ủi!");
          return;
        }
        saveDraft("scheduled");
        window.location.href = "../scheduled.html";
      }

      window.handleBookingNow = handleBookingNow;
      window.handleScheduledBooking = handleScheduledBooking;
    </script>
  </body>
</html>
