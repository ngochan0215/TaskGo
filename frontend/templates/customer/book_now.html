<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskGo</title>
    <link rel="stylesheet" type="text/css" href="../../public/css/output.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../public/favicons/favicon.ico"
    />
    <script src="../../components/cus_header.js" defer></script>
    <script src="../../components/cus_footer.js" defer></script>
  </head>

  <body class="bg-primary-100 min-h-screen font-montserrat flex flex-col">
    <app-header active="bookNow" heading="Đặt ngay"></app-header>
    <main class="p-4 space-y-4 pb-20 flex-grow">
      <div class="bg-white rounded-xl shadow-md p-4 space-y-4">
        <div class="flex items-center justify-between border-b pb-2">
          <h2 class="text-2xl font-bold text-primary-500">
            Ghi chú cho Tasker
          </h2>
        </div>

        <p class="text-xs mb-4">
          Ghi chú này sẽ giúp Tasker hoàn thành công việc tốt hơn
        </p>

        <div class="mb-6">
          <textarea
            rows="5"
            class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
            placeholder="Bạn có yêu cầu gì thêm hãy nhập ở đây"
          ></textarea>
        </div>
        <div class="flex space-x-4">
          <button
            onclick="handleGoPayment()"
            class="action-btn action-btn-hover w-full text-center"
          >
            <span id="bookingTotalText">---</span>
          </button>
        </div>
      </div>
    </main>

    <app-footer></app-footer>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module">
      import { initSocket } from "../js/socket.js";
      initSocket();
    </script>

    <script>
      const bookingDraftRaw = localStorage.getItem("bookingDraft");
      console.log("BOOKING DRAFT: ", bookingDraftRaw);

      if (!bookingDraftRaw) {
        alert("Không tìm thấy thông tin đặt dịch vụ.");
        window.location.href = "./service_listpage.html"; // đổi từ "/" để không bị bay ra root
      }

      const bookingDraft = bookingDraftRaw ? JSON.parse(bookingDraftRaw) : null;

      const formatCurrency = (v) => v.toLocaleString("vi-VN") + " VND";

      const totalTextEl = document.getElementById("bookingTotalText");

      if (
        bookingDraft?.task_payload?.total_time != null &&
        bookingDraft?.final_amount != null
      ) {
        const hours = Math.floor(bookingDraft.task_payload.total_time / 60);
        const minutes = bookingDraft.task_payload.total_time % 60;

        let timeText = "";
        if (hours > 0) timeText += `${hours}h`;
        if (minutes > 0) timeText += `${minutes}p`;

        totalTextEl.textContent = `${formatCurrency(bookingDraft.final_amount)} / ${timeText ? timeText : "h"}`;
      }

      function handleGoPayment() {
        if (!bookingDraft) return;

        const note = document.querySelector("textarea").value.trim();
        bookingDraft.note = note;

        localStorage.setItem("bookingDraft", JSON.stringify(bookingDraft));

        console.log("BOOKING DRAFT BEFORE GOING TO PAYMENT: ", bookingDraft);
        window.location.href = "./payment_pages/payment.html";
      }
    </script>
  </body>
</html>
