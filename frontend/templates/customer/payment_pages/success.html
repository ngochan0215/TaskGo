<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán thành công - TaskGo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.6s ease-out 0.2s both;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        .success-icon svg {
            width: 50px;
            height: 50px;
            stroke: white;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: checkmark 0.6s ease-out 0.5s forwards;
        }

        @keyframes checkmark {
            to {
                stroke-dashoffset: 0;
            }
        }

        h1 {
            color: #10b981;
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .message {
            color: #6b7280;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .order-info {
            background: #f3f4f6;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }

        .order-info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .order-info-item:last-child {
            border-bottom: none;
        }

        .order-info-label {
            color: #6b7280;
            font-size: 14px;
        }

        .order-info-value {
            color: #1f2937;
            font-weight: 600;
            font-size: 14px;
        }

        .loader {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-message {
            color: #6b7280;
            font-size: 14px;
            margin-top: 15px;
        }

        .btn {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">
            <svg viewBox="0 0 52 52">
                <polyline points="14 27 22 35 38 19"/>
            </svg>
        </div>
        
        <h1>Thanh toán thành công!</h1>
        <p class="message">Cảm ơn bạn đã sử dụng dịch vụ TaskGo. Đơn hàng của bạn đang được xử lý.</p>
        
        <div class="order-info hidden" id="orderInfo">
            <div class="order-info-item">
                <span class="order-info-label">Mã đơn hàng:</span>
                <span class="order-info-value" id="orderId">-</span>
            </div>
            <div class="order-info-item">
                <span class="order-info-label">Trạng thái:</span>
                <span class="order-info-value" style="color: #10b981;">Đã thanh toán</span>
            </div>
        </div>

        <p class="status-message">
            Bạn sẽ được chuyển về trang đặt sau <span id="countdown">10</span> giây…
        </p>

        <div class="error-message" id="errorMessage"></div>
        
        <div id="loadingSection">
            <div class="loader"></div>
            <p class="status-message">Đang xác nhận thanh toán...</p>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module">
        import { initSocket } from "../../js/socket.js";

        initSocket();
    </script>
    
    <script>
        // Lấy orderId từ URL query params
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderCode') || urlParams.get('orderId');

        async function updateSuccessfulTransaction() {
            if (!orderId) {
                showError('Không tìm thấy mã đơn hàng');
                return;
            }

            try {
                const response = await fetch(`/api/transaction/${orderId}/success`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    // Hiển thị thông tin đơn hàng
                    document.getElementById('orderId').textContent = orderId;
                    document.getElementById('orderInfo').classList.remove('hidden');
                    document.getElementById('loadingSection').classList.add('hidden');
                    // document.getElementById('actionSection').classList.remove('hidden');

                    startRedirectCountdown();
                } else {
                    showError(data.error || 'Có lỗi xảy ra khi cập nhật giao dịch');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Không thể kết nối đến server. Vui lòng thử lại sau.');
            }
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('loadingSection').classList.add('hidden');
            document.getElementById('actionSection').classList.remove('hidden');
        }

        // Tự động gọi API khi trang load
        window.addEventListener('DOMContentLoaded', () => {
            updateSuccessfulTransaction();
        });

        function startRedirectCountdown() {
            const REDIRECT_AFTER = 10;
            const REDIRECT_URL = './ordering_success.html';

            let remaining = REDIRECT_AFTER;
            const countdownEl = document.getElementById('countdown');

            const timer = setInterval(() => {
                remaining--;
                if (countdownEl) countdownEl.textContent = remaining;

                if (remaining <= 0) {
                    clearInterval(timer);
                    window.location.href = REDIRECT_URL;
                }
            }, 1000);
        }

    </script>
</body>
</html>
