<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskGo</title>

    <link
      rel="stylesheet"
      type="text/css"
      href="../../../public/css/output.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../../public/favicons/favicon.ico"
    />
  </head>

  <body class="bg-primary-100 min-h-screen font-montserrat flex flex-col">
    <div id="app-header"></div>

    <main class="p-4 space-y-4 pb-32">
      <div
        id="serviceSummary"
        class="bg-white rounded-xl shadow-md p-4 space-y-3"
      ></div>

      <a
        href="./voucher.html"
        class="flex justify-between items-center bg-white rounded-xl shadow-md p-4 text-gray-400 font-medium hover:bg-gray-50"
      >
        <span class="flex items-center space-x-2">
          <span class="material-symbols-outlined text-gray-100 text-xl"
            >confirmation_number</span
          >
          <span>Thêm mã giảm giá</span>
        </span>
        <span class="material-symbols-outlined text-gray-400"
          >chevron_right</span
        >
      </a>

      <div class="bg-white rounded-xl shadow-md p-4 space-y-2 text-base">
        <div class="flex justify-between">
          <span class="text-gray-800">Tổng tiền dịch vụ</span>
          <span id="baseAmount" class="font-semibold text-gray-800"></span>
        </div>

        <div class="flex justify-between">
          <span class="text-gray-800">Mã giảm</span>
          <span id="voucherAmount" class="font-semibold text-gray-800"></span>
        </div>

        <div class="flex justify-between border-b border-gray-400 pb-2">
          <span class="text-gray-800">Phí dịch vụ (nếu có)</span>
          <span id="extraFee" class="font-semibold text-gray-800">0 VND</span>
        </div>

        <div class="flex justify-between text-base pt-2">
          <span class="font-bold text-dark-900">Tổng tiền</span>
          <span id="finalAmount" class="font-bold text-dark-900">0 VND</span>
        </div>

        <div class="flex justify-between items-center space-y-4 space-x-4">
          <span id="finalAmountt" class="text-2xl font-bold text-dark-900"
            >0 VND</span
          >
          <button class="action-btn action-btn-hover">
            <a href="./payment_confirmation.html">Tiếp theo</a>
          </button>
        </div>
      </div>
    </main>

    <div id="app-footer"></div>

    <script type="module">
      import { initLayout } from "../../js/ui/shared-layout.js";
      initLayout({
        role: "customer",
        title: "Dịch vụ của bạn",
        active: "activity",
      });
    </script>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module">
      import { initSocket } from "../../js/socket.js";
      initSocket();
    </script>

    <script src="../../js/payment.js" defer></script>
  </body>
</html>
