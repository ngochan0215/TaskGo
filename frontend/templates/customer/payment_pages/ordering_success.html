<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskGo</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="../../../public/css/output.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../../public/favicons/favicon.ico"
    />
    <script src="../../../components/cus_header.js" defer></script>
    <script src="../../../components/cus_footer.js" defer></script>
  </head>

  <body class="bg-primary-100 min-h-screen font-montserrat">
    <app-header active="home" heading="Đặt dịch vụ thành công"></app-header>

    <main class="p-4 space-y-4 pb-32">
      <div class="bg-white rounded-xl shadow-md p-6 space-y-4 text-center">
        <div
          class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-green-500 mb-4"
        >
          <span class="material-symbols-outlined text-6xl text-white">
            check_circle
          </span>
        </div>

        <p
          class="text-base text-green-600 font-medium uppercase tracking-wider mb-1"
        >
          Hoàn tất
        </p>
        <h2 class="text-2xl font-bold text-dark-900 mb-4">
          Đặt dịch vụ thành công
        </h2>
      </div>

      <!-- Tasker Search Status -->
      <div id="taskerSearchStatus" class="bg-white rounded-xl shadow-md p-4">
        <!-- Content will be rendered by JavaScript -->
      </div>

      <!-- Service Details -->
      <div class="bg-white rounded-xl shadow-md p-4 space-y-3">
        <h3 class="font-bold text-dark-900 text-lg flex items-center">
          <span class="material-symbols-outlined text-primary-500 mr-2"
            >info</span
          >
          Chi tiết dịch vụ
        </h3>
        <div id="serviceDetails" class="border-t border-gray-200 pt-3">
          <!-- Content will be rendered by JavaScript -->
        </div>
      </div>

      <!-- Address Details -->
      <div class="bg-white rounded-xl shadow-md p-4 space-y-3">
        <h3 class="font-bold text-dark-900 text-lg flex items-center">
          <span class="material-symbols-outlined text-primary-500 mr-2"
            >location_on</span
          >
          Địa chỉ làm việc
        </h3>
        <div id="addressDetails" class="border-t border-gray-200 pt-3">
          <!-- Content will be rendered by JavaScript -->
        </div>
      </div>

      <!-- Payment Details -->
      <div class="bg-white rounded-xl shadow-md p-4 space-y-3">
        <h3 class="font-bold text-dark-900 text-lg flex items-center">
          <span class="material-symbols-outlined text-primary-500 mr-2"
            >receipt</span
          >
          Thông tin thanh toán
        </h3>
        <div id="paymentDetails" class="border-t border-gray-200 pt-3">
          <!-- Content will be rendered by JavaScript -->
        </div>
      </div>
    </main>
    <app-footer></app-footer>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module">
      import { initSocket } from "../../js/socket.js";

      initSocket();
    </script>
    <script src="../../js/ordering_success.js"></script>
  </body>
</html>
