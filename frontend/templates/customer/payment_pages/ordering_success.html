<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskGo</title>

    <link
      rel="stylesheet"
      type="text/css"
      href="../../../public/css/output.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="../../../public/favicons/favicon.ico"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
  </head>

  <body class="bg-primary-100 min-h-screen font-montserrat flex flex-col">
    <!-- ✅ Shared header -->
    <div id="app-header"></div>

    <!-- ✅ GIỮ NGUYÊN UI MAIN -->
    <main class="p-4 space-y-4 pb-32">
      <div class="bg-white rounded-xl shadow-md p-4 space-y-2">
        <h3 class="font-bold text-dark-900">Địa chỉ làm việc</h3>

        <select
          id="addressSelect"
          class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-primary-500"
        >
          <option value="">-- Chọn địa chỉ --</option>
          <option value="addr_1">Nhà riêng - Quận 7</option>
          <option value="addr_2">Căn hộ - Thủ Đức</option>
        </select>
        <button
          id="editAddressBtn"
          class="text-primary-500 hover:text-primary-700"
          onclick="openAddAddressModal()"
        >
          Thêm địa chỉ
          <span class="material-symbols-outlined">edit_location</span>
        </button>
      </div>

      <div class="bg-white rounded-xl shadow-md p-4 space-y-2">
        <h3 class="font-bold text-dark-900">Phương thức thanh toán</h3>

        <label class="flex items-center space-x-3">
          <input type="radio" name="payment" value="cash" checked />
          <span>Tiền mặt</span>
        </label>

        <label class="flex items-center space-x-3">
          <input type="radio" name="payment" value="bank_transfer" />
          <span>Chuyển khoản ngân hàng (Mã QR)</span>
        </label>

        <label class="flex items-center space-x-3">
          <input type="radio" name="payment" value="ewallet" />
          <span>Ví TaskGo</span>
        </label>

        <label class="flex items-center space-x-3">
          <input type="radio" name="payment" value="credit_card" />
          <span>Thẻ tín dụng</span>
        </label>
      </div>

      <!-- Tổng tiền -->
      <div class="bg-white rounded-xl shadow-md p-4 space-y-2 text-base">
        <!-- Tổng tiền dịch vụ -->
        <div class="flex justify-between">
          <span class="text-gray-100">Tổng tiền dịch vụ</span>
          <span id="baseAmount" class="font-semibold text-gray-100"></span>
        </div>

        <!-- Voucher -->
        <div class="flex justify-between">
          <span class="text-gray-100">Mã giảm</span>
          <span id="voucherAmount" class="font-semibold text-gray-100"></span>
        </div>

        <!-- Phí dịch vụ -->
        <div class="flex justify-between border-b border-gray-400 pb-2">
          <span class="text-gray-100">Phí dịch vụ (nếu có)</span>
          <span id="extraFee" class="font-semibold text-gray-100">0 VND</span>
        </div>

        <div class="flex justify-between text-base pt-2">
          <span class="font-bold text-dark-900">Tổng tiền</span>
          <span id="finalAmount" class="font-bold text-dark-900">0 VND</span>
        </div>

        <div class="flex justify-between items-center space-y-4 space-x-4">
          <span id="finalAmountt" class="text-2xl font-bold text-dark-900"
            >0 VND</span
          >
          <button id="submitBtn" class="action-btn action-btn-hover">
            Xác nhận thông tin thanh toán
          </button>
        </div>
      </div>
    </main>

    <!-- ✅ Shared footer -->
    <div id="app-footer"></div>

    <!-- ✅ Modal GIỮ NGUYÊN -->
    <div
      id="addressModal"
      class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-4"
    >
      <div
        class="bg-white w-full max-w-2xl rounded-2xl shadow-lg p-8 border border-gray-200 max-h-[60vh] overflow-y-auto"
      >
        <div class="mb-6">
          <h3
            class="text-2xl font-bold text-primary-400 border-b-2 border-primary-400 pb-2 inline-block"
          >
            Thêm địa chỉ mới
          </h3>
          <p class="text-gray-500 mt-2">Chọn địa chỉ cư trú của bạn</p>
        </div>

        <!-- form chọn địa chỉ -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div class="space-y-6">
            <div>
              <label class="block text-gray-800 font-bold mb-2"
                >Tỉnh / Thành phố <span class="text-red-500">*</span></label
              >
              <select
                id="city"
                class="w-full border border-gray-300 rounded-xl px-4 py-3 bg-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none"
              >
                <option value="" selected disabled>
                  Đang tải danh sách...
                </option>
              </select>
            </div>
            <div>
              <label class="block text-gray-800 font-bold mb-2"
                >Phường / Xã <span class="text-red-500">*</span></label
              >
              <select
                id="ward"
                disabled
                class="w-full border border-gray-300 rounded-xl px-4 py-3 bg-white transition-colors focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none"
              >
                <option value="" selected disabled>
                  -- Vui lòng chọn Quận trước --
                </option>
              </select>
            </div>
          </div>

          <div class="space-y-6">
            <div>
              <label class="block text-gray-800 font-bold mb-2"
                >Quận / Huyện <span class="text-red-500">*</span></label
              >
              <select
                id="district"
                disabled
                class="w-full border border-gray-300 rounded-xl px-4 py-3 bg-white transition-colors focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none"
              >
                <option value="" selected disabled>
                  -- Vui lòng chọn Tỉnh trước --
                </option>
              </select>
            </div>
            <div>
              <label class="block text-gray-800 font-bold mb-2"
                >Số nhà, tên đường</label
              >
              <input
                type="text"
                id="street"
                placeholder="VD: 123 Nguyễn Huệ (Không bắt buộc)"
                class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none"
              />
            </div>
          </div>
        </div>

        <button
          type="button"
          id="btn-search-map"
          class="w-full mb-6 border-2 border-dashed border-primary-400 text-primary-600 py-3 rounded-xl font-bold hover:bg-green-50 transition-colors flex justify-center items-center gap-2"
        >
          <span>📍</span> Cập nhật vị trí trên bản đồ
        </button>

        <div
          id="map"
          class="h-[400px] rounded-xl shadow-inner border border-gray-200 mb-6 bg-gray-100"
        ></div>

        <input type="hidden" id="result_city" name="city" />
        <input type="hidden" id="result_district" name="district" />
        <input type="hidden" id="result_ward" name="ward" />
        <input type="hidden" id="result_lat" name="lat" />
        <input type="hidden" id="result_lng" name="lng" />

        <div class="flex justify-end gap-2 pt-4">
          <button
            onclick="closeAddressModal()"
            class="px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-50 transition-colors"
          >
            Hủy
          </button>
          <button
            onclick="saveAddress()"
            class="px-4 py-2 rounded-lg bg-primary-500 text-white hover:bg-primary-600 transition-colors"
          >
            Lưu địa chỉ
          </button>
        </div>
      </div>
    </div>

    <!-- ✅ Inject shared header/footer -->
    <script type="module">
      import { initLayout } from "../../js/ui/shared-layout.js";
      initLayout({
        role: "customer",
        title: "Dịch vụ của bạn",
        active: "activity",
      });
    </script>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module">
      import { initSocket } from "../../js/socket.js";
      initSocket();
    </script>

    <script src="../../js/payment_confirmation.js"></script>
  </body>
</html>
